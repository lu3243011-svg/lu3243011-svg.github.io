<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>军队文职公共科目刷题系统</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#1f2937}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.card{width:min(620px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:34px;box-shadow:0 18px 45px rgba(15,23,42,.08);text-align:center}h1{font-size:26px;margin:0 0 12px}.sub{color:#6b7280;line-height:1.7;margin-bottom:24px}.bar{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden}.fill{height:100%;width:8%;background:#2563eb;border-radius:999px;transition:width .25s ease}.status{margin-top:14px;font-size:14px;color:#4b5563}.err{display:none;margin-top:18px;text-align:left;padding:14px 16px;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:12px;line-height:1.65;word-break:break-word}.retry{display:none;margin:16px auto 0;padding:10px 18px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><div class="card"><h1>军队文职公共科目刷题系统</h1><div class="sub">正在校验并加载完整题库。首次打开需要读取题库数据，请稍候。</div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">正在连接题库…</div><div class="err" id="err"></div><button class="retry" id="retry" onclick="location.reload()">重新加载</button></div></div>
<script>
(async()=>{
const status=document.getElementById('status'),fill=document.getElementById('fill'),err=document.getElementById('err'),retry=document.getElementById('retry');
try{
if(typeof DecompressionStream==='undefined') throw new Error('当前浏览器不支持网页解压功能，请使用最新版 Chrome、Edge 或 Safari。');
const names=['part01.txt','p01.txt','part02.txt','part03.txt','part04.txt','part05.txt','p05.txt','part06.txt','part07.txt','part08.txt','p08.txt','part09.txt'];
const data={};
for(let i=0;i<names.length;i++){
 status.textContent=`正在读取题库数据 ${i+1}/${names.length}…`; fill.style.width=`${8+(i/names.length)*47}%`;
 const r=await fetch(names[i],{cache:'no-store'}); if(!r.ok) throw new Error(`${names[i]} 读取失败（HTTP ${r.status}）`);
 data[names[i]]=(await r.text()).replace(/\s+/g,'');
}
const variants01=['part01.txt','p01.txt'];
const variants05=['part05.txt','p05.txt'];
const variants08=['p08.txt','part08.txt'];
let solved=null,lastError=''; let attempt=0;
for(const a of variants01){for(const b of variants05){for(const c of variants08){
 attempt++; status.textContent=`正在校验题库数据（方案 ${attempt}/8）…`; fill.style.width=`${55+attempt*4}%`;
 const pieces=[data[a],data['part02.txt'],data['part03.txt'],data['part04.txt'],data[b],data['part06.txt'],data['part07.txt'],data[c],data['part09.txt']];
 const b64=pieces.join('');
 if(!/^[A-Za-z0-9+/]*={0,2}$/.test(b64)){lastError='分片中含非 Base64 字符';continue;}
 if(b64.length%4===1){lastError=`Base64 长度异常：${b64.length}`;continue;}
 let bin; try{bin=atob(b64)}catch(e){lastError='Base64 解码失败';continue;}
 const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
 try{
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const html=await new Response(stream).text();
   if(html && /<!doctype|<html/i.test(html) && html.includes('军队文职')){solved=html;break;}
   lastError='解压后的内容不是完整题库网页';
 }catch(e){lastError='gzip 解压校验失败';}
}if(solved)break;}if(solved)break;}
if(!solved) throw new Error('8 种备用分片组合均未通过校验。最后错误：'+lastError);
status.textContent='题库加载完成，正在进入…';fill.style.width='100%';
setTimeout(()=>{document.open();document.write(solved);document.close();},120);
}catch(e){console.error(e);status.textContent='加载失败';fill.style.width='100%';err.style.display='block';retry.style.display='block';err.textContent='错误信息：'+(e&&e.message?e.message:String(e));}
})();
</script>
</body>
</html>
