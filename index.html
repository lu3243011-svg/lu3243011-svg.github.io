<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>军队文职公共科目刷题系统</title>
<style>
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#1f2937}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.card{width:min(620px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:34px;box-shadow:0 18px 45px rgba(15,23,42,.08);text-align:center}
  h1{font-size:26px;margin:0 0 12px}.sub{color:#6b7280;line-height:1.7;margin-bottom:24px}.bar{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden}.fill{height:100%;width:8%;background:#2563eb;border-radius:999px;transition:width .25s ease}.status{margin-top:14px;font-size:14px;color:#4b5563}.err{display:none;margin-top:18px;text-align:left;padding:14px 16px;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:12px;line-height:1.65;word-break:break-word}.retry{display:none;margin:16px auto 0;padding:10px 18px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>军队文职公共科目刷题系统</h1>
<div class="sub">正在加载完整题库，请稍候。首次打开需要读取题库数据，之后即可正常刷题。</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="status" id="status">正在连接题库…</div>
<div class="err" id="err"></div>
<button class="retry" id="retry" onclick="location.reload()">重新加载</button>
</div></div>
<script>
(async()=>{
  const status=document.getElementById('status'), fill=document.getElementById('fill'), err=document.getElementById('err'), retry=document.getElementById('retry');
  try{
    const files=Array.from({length:9},(_,i)=>`part${String(i+1).padStart(2,'0')}.txt`);
    const chunks=[];
    for(let i=0;i<files.length;i++){
      status.textContent=`正在读取题库数据 ${i+1}/${files.length}…`;
      fill.style.width=`${8+(i/files.length)*52}%`;
      const r=await fetch(files[i],{cache:'no-store'});
      if(!r.ok) throw new Error(`${files[i]} 读取失败（HTTP ${r.status}）`);
      chunks.push((await r.text()).trim());
    }
    status.textContent='正在解压题库…'; fill.style.width='68%';
    const b64=chunks.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(typeof DecompressionStream==='undefined') throw new Error('当前浏览器不支持网页解压功能，请使用最新版 Chrome、Edge 或 Safari。');
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    if(!html || !/<html|<!doctype/i.test(html)) throw new Error('题库数据解压后不是有效网页，请检查分片是否完整。');
    status.textContent='题库加载完成，正在进入…'; fill.style.width='100%';
    setTimeout(()=>{document.open();document.write(html);document.close();},120);
  }catch(e){
    console.error(e); status.textContent='加载失败'; fill.style.width='100%';
    err.style.display='block'; retry.style.display='block';
    err.textContent='错误信息：'+(e&&e.message?e.message:String(e));
  }
})();
</script>
</body>
</html>
